name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-debug-apk:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version

          version_line="$(java -version 2>&1 | head -n 1 || true)"
          if [[ -z "${version_line}" ]]; then
            echo "::error::Unable to detect active Java version."
            exit 1
          fi

          raw_version="$(printf '%s\n' "${version_line}" | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [[ -z "${raw_version}" ]]; then
            echo "::error::Could not parse Java version from: ${version_line}"
            exit 1
          fi

          if [[ "${raw_version}" == 1.* ]]; then
            major_version="$(printf '%s' "${raw_version}" | cut -d. -f2)"
          else
            major_version="$(printf '%s' "${raw_version}" | cut -d. -f1 | sed -E 's/[^0-9].*$//')"
          fi

          if [[ -z "${major_version}" || ! "${major_version}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine numeric Java major version from: ${raw_version}"
            exit 1
          fi

          echo "Detected Java major version: ${major_version}"
          if (( major_version < 17 )); then
            echo "::error::Java 17 or newer is required, but detected Java ${major_version}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "./debug.keystore" ]]; then
            echo "Debug keystore already exists."
          else
            if [[ -z "${JAVA_HOME:-}" || ! -x "${JAVA_HOME}/bin/keytool" ]]; then
              echo "::error::keytool was not found in JAVA_HOME (${JAVA_HOME:-unset})."
              exit 1
            fi

            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -keystore "./debug.keystore" \
              -storepass "android" \
              -alias "androiddebugkey" \
              -keypass "android" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg "RSA" \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1 || {
                echo "::error::Failed to generate temporary ./debug.keystore."
                exit 1
              }
          fi

          if [[ ! -f "./debug.keystore" || ! -s "./debug.keystore" ]]; then
            echo "::error::Temporary ./debug.keystore is missing or empty after creation."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          expected_apk="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -e "${expected_apk}" ]]; then
            echo "::error::Expected debug APK not found at: ${expected_apk}"
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [[ ! -f "${expected_apk}" ]]; then
            echo "::error::${expected_apk} exists but is not a regular file."
            exit 1
          fi

          if [[ ! -s "${expected_apk}" ]]; then
            echo "::error::${expected_apk} is empty."
            exit 1
          fi

          if [[ "${expected_apk}" != *.apk ]]; then
            echo "::error::${expected_apk} does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK: ${expected_apk}"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "${source_apk}" || ! -s "${source_apk}" ]]; then
            echo "::error::Verified debug APK is missing or empty: ${source_apk}"
            exit 1
          fi

          repo_raw="${GITHUB_REPOSITORY#*/}"
          repo_sanitized="$(printf '%s' "${repo_raw}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "${repo_sanitized}" ]]; then
            repo_sanitized="android-app"
          fi

          asset_name="${repo_sanitized}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          release_dir="$(mktemp -d "${RUNNER_TEMP}/apk-release.XXXXXX")"
          asset_path="${release_dir}/${asset_name}"

          cp -- "${source_apk}" "${asset_path}"

          if [[ ! -f "${asset_path}" || ! -s "${asset_path}" || "${asset_path}" != *.apk ]]; then
            echo "::error::Prepared release APK asset is invalid: ${asset_path}"
            exit 1
          fi

          release_tag="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          release_title="Debug APK Build #${GITHUB_RUN_NUMBER}"

          {
            echo "asset_path=${asset_path}"
            echo "asset_name=${asset_name}"
            echo "release_tag=${release_tag}"
            echo "release_title=${release_title}"
          } >> "${GITHUB_OUTPUT}"

          echo "Prepared APK release asset: ${asset_name}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          RELEASE_TAG: ${{ steps.prepare_release_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_release_asset.outputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          if [[ -z "${ASSET_PATH}" || ! -f "${ASSET_PATH}" || ! -s "${ASSET_PATH}" || "${ASSET_PATH}" != *.apk ]]; then
            echo "::warning::Prepared release APK asset validation failed; skipping GitHub Release creation."
            exit 1
          fi

          release_notes="$(cat <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Purpose: Intended for testing only.
          - Distribution notice: This APK is not a Play Store production release.
          - Signing notice: This APK is signed only with a temporary debug keystore.
          EOF
          )"

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "${release_notes}" \
            --latest

      - name: Report APK download result
        if: ${{ !cancelled() && steps.publish_release.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.prepare_release_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_release_asset.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${RELEASE_OUTCOME}" == "success" ]]; then
            release_url="$(gh release view "${RELEASE_TAG}" --json url --jq '.url')"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${release_url}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **Status:** APK build, Actions artifact upload, and GitHub Release publishing succeeded."
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo "- **GitHub Release Page:** ${release_url}"
              echo ""
              echo "Download \`${ASSET_NAME}\` directly from the **Assets** section on the GitHub Release page above."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **Status:** Debug APK build and Actions artifact upload succeeded, but GitHub Release publishing failed."
              echo "- **Backup Download:** Download the \`app-debug-apk\` artifact from this workflow run's **Artifacts** section."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
